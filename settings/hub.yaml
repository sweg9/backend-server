# Hub mode (a laptop at home): the records, the runs and the hardware. Starting values to be tuned (C-12).
# Secrets are never here: HUB_TOKEN, APP_PASSWORD_HASH and the AWS credentials come from the environment (C-10).
server_url: wss://nova.example.com/api/ws/hub   # the server on AWS; the domain is still open
kms_key_id: null             # the KMS key that seals photos (C-05); set when the AWS account is ready
hand: linear_actuators       # linear_actuators | unity_sim | script (FR-11, C-13); the demo drives the real actuators
serial_port: COM6            # the demo board on the Windows demo laptop (COM3, COM4 there are Bluetooth); on a Mac /dev/cu.usbmodem…; see firmware/README.md
camera_index: 0
camera_api: auto             # OpenCV backend. auto: dshow on Windows, avfoundation on a Mac, v4l2 on Linux
photo_max_side: 1280         # longest side of a photo sent to the enclave
photo_jpeg_quality: 85       # 0 to 100
camera_flush_frames: 3       # frames dropped before a photo, so it is not an old one from the buffer
camera_lock_exposure: true   # lock the exposure for the photos after a command (FR-08 camera check)
camera_exposure_auto: null   # CAP_PROP_AUTO_EXPOSURE for auto; null: known for dshow (0.75) and v4l2 (3)
camera_exposure_manual: null # the same for manual; null: dshow 0.25, v4l2 1. Other APIs: set both or no lock
camera_settle_frames: 20     # frames read with auto exposure before it is locked (about 0.7 s at 30 fps)
log_file: data/hub/hub.log   # an Alloy on this laptop pushes it to Loki on AWS
log_max_mb: 10
log_keep_files: 5
spots:                       # spot_id -> room; the team member picks the names
  living_wall_1: living_room
actuators:                   # which part of the image each actuator faces (FR-09)
  - {id: A1, faces: [0.0, 0.0, 0.5, 1.0]}
  - {id: A2, faces: [0.5, 0.0, 1.0, 1.0]}

# The records (wiki: Database). Paths are relative to the working directory; data/ is git-ignored.
database_url: sqlite:///data/hub/app.db
crop_dir: data/hub/crops
backup_dir: data/hub/backups
backup_keep_days: 7
backup_at: "03:00"           # local time
time_zone: Asia/Seoul
session_days: 30             # Sign-in
uses_keep_days: 60
crops_unreferenced_keep_days: 30

# Time limits for the server's answers (wiki: Hub messages > Answers that do not come)
heartbeat_s: 5
recognize_timeout_s: 10
check_timeout_s: 10
refind_timeout_s: 10
people_timeout_s: 3          # FR-10: no answer means no press
decide_timeout_s: 5          # FR-05: no answer means only suggest

# Runs
duplicate_trigger_s: 10      # FR-05
channel_timeout_s: 5         # FR-07
effect_wait_s: 3             # FR-08
unsure_recheck_s: 3          # FR-08
max_press_tries: 2           # FR-11

# Habits and learning
watch_interval_s: 2          # uses for habits; raise it first if the connection is slow (5th meeting)
watch_quiet_s: 10
habit_window_min: 30         # FR-04
habit_min_days: 3
habit_lookback_days: 14
habit_run_at: "04:00"        # local time
habit_independence: ask_first
habit_removed_block_days: 30
demote_after_rejections: 3   # FR-04
channel_newest_weight: 0.3   # FR-12
link_confidence_step: 0.05   # FR-12
stale_below: 0.2
fingerprint_same_control: 0.9  # FR-01 duplicate check; to be measured
