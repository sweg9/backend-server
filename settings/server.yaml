# Server mode (a pod on k3s on AWS EC2): a relay that keeps no records (wiki: Stack). Starting values to be
# tuned (C-12). In k8s this file comes from a ConfigMap. Secrets are never here: HUB_TOKEN comes from a k8s
# Secret (C-10).
enclave_cid: 16              # the Nitro Enclave, over vsock
enclave_port: 5000
s3_bucket: null              # sealed photos and model files; set when the AWS account is ready
hub_offline_after_missed: 3  # heartbeats
app_timeout_s: 5             # the hub's answer to a relayed call; then 503
stop_timeout_s: 2            # without stop.done, the app tells the resident to use the key on the hub
login_max_failures: 5        # Sign-in: then 429 for login_window_s
login_window_s: 60
