# Loki, single binary, files on the EC2 instance's EBS volume, 14 days of logs (wiki: Stack > Logging).
# The hub at home pushes its log lines to /loki/api/v1/push through the ingress, behind basic auth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  namespace: logging
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore: {store: inmemory}
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2026-11-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config:
      retention_period: 336h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: logging
spec:
  replicas: 1
  serviceName: loki
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      securityContext: {runAsUser: 10001, fsGroup: 10001}
      initContainers:
        - name: own-data
          image: busybox:1.37
          command: [sh, -c, "chown -R 10001:10001 /loki"]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: data, mountPath: /loki}
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: [-config.file=/etc/loki/loki.yaml]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: loki}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path   # k3s's default, on the instance's EBS volume
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logging
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
---
# The hub's own Alloy pushes here. The Secret loki-push holds the htpasswd line (deploy/README.md).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-auth
  namespace: logging
spec:
  basicAuth:
    secret: loki-push
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki-push
  namespace: logging
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`nova.example.com`) && Path(`/loki/api/v1/push`)
      kind: Rule
      middlewares:
        - name: loki-push-auth
      services:
        - name: loki
          port: 3100
  tls:
    secretName: nova-tls
