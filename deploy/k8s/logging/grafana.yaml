# Grafana with Loki as its data source and one dashboard (wiki: Stack > Logging).
# Admin password from the Secret `grafana` (GRAFANA_ADMIN_PASSWORD), made by deploy/up.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: logging
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.logging.svc:3100
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: sweg9
        folder: sweg9
        type: file
        options: {path: /var/lib/grafana/dashboards}
  sweg9.json: |
    {
      "title": "sweg9 hub and server",
      "uid": "sweg9",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": [{"name": "run_id", "type": "textbox", "label": "run_id", "query": ""}]},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Errors per module", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "loki", "uid": "loki"},
         "targets": [{"expr": "sum by (module) (count_over_time({level=\"error\"}[5m]))"}]},
        {"id": 2, "type": "timeseries", "title": "hub.status received per minute (gaps = hub offline)",
         "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "datasource": {"type": "loki", "uid": "loki"},
         "targets": [{"expr": "sum(count_over_time({mode=\"server\"} |= \"hub.status\" [1m]))"}]},
        {"id": 3, "type": "logs", "title": "Lines of one run (enter run_id above)", "gridPos": {"x": 0, "y": 8, "w": 24, "h": 12},
         "datasource": {"type": "loki", "uid": "loki"},
         "targets": [{"expr": "{mode=~\"hub|server\"} | json | run_id=\"$run_id\""}]}
      ],
      "schemaVersion": 39
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - {name: http, containerPort: 3000}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana, key: GRAFANA_ADMIN_PASSWORD}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_SERVER_ROOT_URL, value: "https://grafana.nova.example.com"}   # the domain is still open
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: provisioning, mountPath: /var/lib/grafana/dashboards/sweg9.json, subPath: sweg9.json}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: logging
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: logging
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.nova.example.com`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
  tls:
    secretName: nova-tls
