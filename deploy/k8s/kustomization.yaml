# kubectl apply -k deploy/k8s, on the EC2 instance (deploy/README.md).
# Made outside this folder, never committed (C-10): the Secrets `app` (HUB_TOKEN), `grafana`, `loki-push`
# and the TLS Secret `nova-tls`; the ConfigMaps `server-settings` (settings/server.yaml) and
# `enclave-settings` (settings/risk.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - server/server.yaml
  - server/ml-engine.yaml
  - server/ingress.yaml
  - server/web.yaml          # the Dashboard, ghcr.io/sweg9/live-demo
  - logging/loki.yaml
  - logging/alloy.yaml
  - logging/grafana.yaml
