# The server on AWS EC2 (wiki: Stack > Deployment on AWS). It keeps no database: it relays the app's calls
# to the hub, passes the hub's requests to the Nitro Enclave over vsock unopened, and puts sealed photos in S3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: sweg9
  labels: {app: server}
spec:
  replicas: 1
  strategy: {type: Recreate}   # one hub connection at a time
  selector:
    matchLabels: {app: server}
  template:
    metadata:
      labels: {app: server}
    spec:
      containers:
        - name: server
          image: ghcr.io/sweg9/backend-server:latest
          args: [server, --host, 0.0.0.0, --port, "8000"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - secretRef: {name: app}   # HUB_TOKEN
          volumeMounts:
            - {name: settings, mountPath: /app/settings/server.yaml, subPath: server.yaml}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: settings
          configMap: {name: server-settings}
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: sweg9
spec:
  selector: {app: server}
  ports:
    - {name: http, port: 8000, targetPort: http}
