# One host for the app, the API and the hub's WebSocket, so the session cookie is same-origin
# (wiki: Stack > Sign-in). Traefik is the ingress built into k3s. nova.example.com stands for the server's
# domain, which is still open; the TLS certificate for it is in the Secret nova-tls.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: sweg9
spec:
  stripPrefix:
    prefixes: [/api]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sweg9
  namespace: sweg9
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`nova.example.com`) && PathPrefix(`/api`)   # API, /api/ws/app and /api/ws/hub
      kind: Rule
      middlewares:
        - name: strip-api
      services:
        - name: server
          port: 8000
    - match: Host(`nova.example.com`)                           # the Dashboard (server/web.yaml)
      kind: Rule
      services:
        - name: web
          port: 80
  tls:
    secretName: nova-tls
