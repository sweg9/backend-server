# Daily backup of app.db and the crops into ~/sweg9-data/backups (wiki: Stack > Backups).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: sweg9
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: own-backups
              image: busybox:1.37
              command: [sh, -c, "chown -R 10001:10001 /app/data/backups"]
              securityContext: {runAsUser: 0}
              volumeMounts:
                - {name: backups, mountPath: /app/data/backups}
          containers:
            - name: backup
              image: sweg9/backend-server:dev
              imagePullPolicy: Never
              args: [backup]
              volumeMounts:
                - {name: settings, mountPath: /app/settings/server.yaml, subPath: server.yaml}
                - {name: settings, mountPath: /app/settings/risk.yaml, subPath: risk.yaml}
                - {name: data, mountPath: /app/data/server, readOnly: true}
                - {name: backups, mountPath: /app/data/backups}
              resources:
                limits: {cpu: 200m, memory: 128Mi}
          volumes:
            - name: settings
              configMap: {name: server-settings}
            - name: data
              hostPath: {path: /sweg9-data/server, type: Directory}
            - name: backups
              hostPath: {path: /sweg9-data/backups, type: DirectoryOrCreate}
