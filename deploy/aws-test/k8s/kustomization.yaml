# The test on AWS (deploy/aws-test/README.md): only the server, on plain HTTP port 80 with no domain, and the
# image built on the instance. The enclave runs from systemd on the host (bootstrap.sh), not the ml-engine pod,
# so the test does not depend on the Nitro Enclaves device plugin.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s/server/server.yaml
  - ingress.yaml
images:
  - name: ghcr.io/sweg9/backend-server
    newName: docker.io/sweg9/backend-server
    newTag: test
patches:
  - target: {kind: Deployment, name: server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
