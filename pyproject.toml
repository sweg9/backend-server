[project]
name = "backend-server"
version = "0.1.0"
description = "sweg9 backend in two modes: hub and server, both on the laptop at home (the server on k8s). FR-02 to FR-07, FR-10 to FR-12"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Server mode: API, database, scheduler. No YOLO, no PyTorch.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
]
# Hub mode: camera, serial, WebSocket client, and ai-engine (checked out next to this repo).
hub = [
    "websockets>=12",
    "pyserial>=3.5",
    "opencv-python-headless>=4.9",
]

[project.scripts]
backend = "backend.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fr(id): the requirement a test serves, for example fr('FR-07') (C-01)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Import rules of the wiki's Modules page: the two modes talk only through common.
[tool.importlinter]
root_package = "backend"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "hub and server never import each other"
type = "independence"
modules = ["backend.hub", "backend.server"]

[[tool.importlinter.contracts]]
name = "common imports neither mode"
type = "forbidden"
source_modules = ["backend.common"]
forbidden_modules = ["backend.hub", "backend.server"]

[[tool.importlinter.contracts]]
name = "only the hub imports ai_engine"
type = "forbidden"
source_modules = ["backend.common", "backend.server"]
forbidden_modules = ["ai_engine"]
allow_indirect_imports = true
