[project]
name = "backend-server"
version = "0.1.0"
description = "sweg9 backend: the hub at home keeps the records, the server on AWS relays, the Nitro Enclave runs the models. FR-01 to FR-12, with ai-engine for the model steps"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Server mode on AWS: the relay. No database, no models.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Hub mode at home: the database, the scheduler, sign-in, the camera, serial and the WebSocket client.
hub = [
    "websockets>=12",
    "pyserial>=3.5",
    "opencv-python-headless>=4.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
]
# Enclave mode: ai-engine with its YOLO models, pinned to a commit of its yolo11n-640-synth branch.
enclave = [
    "ai-engine[models]",
]

[project.scripts]
backend = "backend.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "import-linter>=2.0",
    "ai-engine",  # without [models]: the enclave tests use FakeEngine and the not-trained answers
]

[tool.uv.sources]
ai-engine = { git = "https://github.com/sweg9/ai-engine", rev = "28be8fb6d74137ea09447573d60973996eb38313" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fr(id): the requirement a test serves, for example fr('FR-07') (C-01)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Import rules of the wiki's Modules page: the hub, the server and the enclave talk only through common.
[tool.importlinter]
root_package = "backend"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "hub, server and enclave never import each other"
type = "independence"
modules = ["backend.hub", "backend.server", "backend.enclave"]

[[tool.importlinter.contracts]]
name = "common imports no mode"
type = "forbidden"
source_modules = ["backend.common"]
forbidden_modules = ["backend.hub", "backend.server", "backend.enclave"]

[[tool.importlinter.contracts]]
name = "only the enclave imports ai_engine"
type = "forbidden"
source_modules = ["backend.common", "backend.hub", "backend.server"]
forbidden_modules = ["ai_engine"]
allow_indirect_imports = true
